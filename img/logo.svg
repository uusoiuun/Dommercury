<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- Круг — солнце и компас -->
  <circle cx="60" cy="60" r="54" stroke-width="2.2"/>
  <!-- Хомус = дом: дужки-скаты сходятся к коньку, внизу округлая головка-кольцо; черта — карниз -->
  <path d="M60 46 L78 66 L78 80 C78 91 70 96 60 96 C50 96 42 91 42 80 L42 66 Z" stroke-width="2.6"/>
  <path d="M42 66 L54 66 M66 66 L78 66" stroke-width="1.4"/>
  <!-- Язычок хомуса: проходит через весь хомус и выходит за конёк -->
  <path d="M60 90 L58.3 70 L60 46 L61.7 70 Z" fill="currentColor" stroke="none"/>
  <!-- ...и изогнутый кончик язычка — шея стерха с головой и клювом -->
  <path d="M60 46 C60 37 60.5 30.5 63.2 25.6" stroke-width="2.4"/>
  <circle cx="64.3" cy="23.8" r="2.4" fill="currentColor" stroke="none"/>
  <path d="M66 23.4 L78.5 26.6" stroke-width="1.8"/>
  <!-- Крылья стерха раскрыты над крышей -->
  <path d="M59 46.6 C49 39 35 38.6 21.5 46.8 C34 45.6 46 47.6 55 53" stroke-width="2" fill="currentColor" fill-opacity="0.16"/>
  <path d="M61 46.6 C71 39 85 38.6 98.5 46.8 C86 45.6 74 47.6 65 53" stroke-width="2" fill="currentColor" fill-opacity="0.16"/>
</svg>
